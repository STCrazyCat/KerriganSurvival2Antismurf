[project]
name = "antismurf"
version = "1.2.0"
description = "Kerrigan Survival 2 (KS2) lobby anti-smurf tool for StarCraft II hosts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "AntiSmurf contributors" }]
keywords = ["starcraft2", "kerrigan-survival", "ks2", "anti-smurf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/STCrazyCat/KerriganSurvival2Antismurf"
Repository = "https://github.com/STCrazyCat/KerriganSurvival2Antismurf"
Issues = "https://github.com/STCrazyCat/KerriganSurvival2Antismurf/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
