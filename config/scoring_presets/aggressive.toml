# Aggressive preset — higher recall, more false positives

[[expression_rules]]
id = "handle_discriminator_high"
enabled = true
label = "玩家 ID 过高（疑似新号）"
left = "handle.profile_id"
op = ">="
right = 12000
weight = 30
else_weight = 0

[[expression_rules]]
id = "playlike_spike_count"
enabled = true
label = "多局 playlike 异常高于核心 MMR"
left = "spike.count"
op = ">="
right = 2
weight = 40
else_weight = 0
min_games = 3

[[expression_rules]]
id = "playlike_spike_magnitude"
enabled = true
label = "单局 playlike 超出核心幅度过大"
left = "spike.max"
op = ">="
right = 400
weight = 30
else_weight = 0
min_games = 2

