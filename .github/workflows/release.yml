name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: Validate release tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches tag
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME" -replace '^v',''
          $version = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne $version) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match VERSION file ($version)"
            exit 1
          }
          Write-Host "Version OK: $version"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Release build reminder
        shell: pwsh
        run: |
          Write-Host "::notice::Tag validated. Upload dist/AntiSmurf-Setup-*.exe to GitHub Releases manually (see docs/RELEASING.md)."
